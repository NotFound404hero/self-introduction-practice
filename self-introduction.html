    <h2>好きなもの</h2>

        <li>・ラーメン（豚骨にあらずばラーメンにあらず）</li>

    <h2>お問い合わせ</h2>
        <form action="/submit" method="post">
        <div>
        <label for="name">お名前:</label>
        <input type="text" id="contact-name" name="name" required>
        </div>
        <label for="contact-category">お問い合わせ種類:</label>
        <select id="contact-category" name="category">
            <option value="">--選択して下さい</option>
            <option value="general">一般的なお問い合わせ</option>
            <option value="feedback">ご意見・ご要望</option>
        </select>
        </div>
        <div>
        <label for="contact-message">お問い合わせ内容：</label>
        <p><textarea id="contact-message" name="message" rows="5" required></textarea></p>
        </div>
        <div>
        <button type="submit">送信する</button>
        </div>
    </form>
</body>

</html>
